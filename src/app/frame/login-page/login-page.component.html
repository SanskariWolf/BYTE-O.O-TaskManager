<div class="main">
    <div class="form-container">
        <!-- Title Section -->
        <div class="title-section">
            <div class="title">Log In</div>
            <div class="subtitle">to verify and sync your data</div>
        </div>

        <!-- Email or Phone Number Section -->
        <div class="input-section">
            <label for="email" class="input-label">Email or Phone Number</label>
            <input type="text" id="email" class="input-field" />
        </div>

        <!-- Password Section -->
        <div class="input-section">
            <label for="password" class="input-label">Password</label>
            <input type="password" id="password" class="input-field" />
        </div>

        <!-- Forgot Password Section -->
        <div class="forgot-password">
            <a href="#" class="forgot-password-link">Forgot your password?</a>
        </div>

        <!-- Submit Button -->
        <div class="submit-button">
            <button class="submit-btn">Log In</button>
        </div>
    </div>
</div>
